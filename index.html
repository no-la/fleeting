<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="写真・文字・絵文字を並べて画像を作る、フリート風のエディタ。">
  <title>fleeting — フリートエディタ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231da1f2'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='sans-serif' font-size='46' font-weight='bold' fill='white'%3Ef%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<main id="app" aria-label="フリートエディタ">
  <section id="stage" aria-label="編集キャンバス">
    <canvas id="canvas" width="1080" height="1920" tabindex="0" aria-label="タップして文字を入力。文字はドラッグで移動、2本指で拡大縮小・回転できます。"></canvas>
    <header id="header">
      <button id="reset" class="round" aria-label="新しく作る"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      <div class="header-right"><button id="undo" class="round" aria-label="元に戻す" disabled><svg viewBox="0 0 24 24"><path d="M8 5 3 10l5 5M3 10h11a7 7 0 0 1 0 14" transform="translate(0 -3)"/></svg></button><button id="export" class="pill" disabled>保存</button></div>
    </header>
    <button id="placeholder" hidden>いまだけ伝えたいことは？</button>
    <div id="text-editor" hidden><textarea id="words" aria-label="テキストを入力" maxlength="1000" spellcheck="false" placeholder="テキストを入力"></textarea></div>
    <span id="gesture-hint" hidden>ドラッグで移動・2本指で拡大や回転</span>
  </section>
  <div id="controls">
    <div id="compose-tools" class="toolbar">
      <button id="background" class="icon" aria-label="背景色を変更"><span class="background-dot"></span></button>
      <button id="add-text" class="icon text-icon" aria-label="テキストを追加">Aa</button>
      <button id="stickers" class="icon" aria-label="絵文字を追加"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14c2 3 6 3 8 0M8 8v2m8-2v2"/></svg></button>
      <button id="adjust" class="icon" aria-label="サイズ・角度を調整" disabled><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6m8 4v6"/></svg></button>
      <button id="help" class="icon help" aria-label="使い方">?</button>
    </div>
    <div id="edit-tools" class="toolbar" hidden>
      <button id="align" class="icon" aria-label="文字揃え：中央"><svg viewBox="0 0 24 24"><path d="M4 5h16M7 10h10M4 15h16M7 20h10"/></svg></button>
      <button id="bold" class="icon" aria-label="太字" aria-pressed="false"><b>B</b></button>
      <button id="highlight" class="icon" aria-label="文字の背景" aria-pressed="false"><span class="highlight-icon">A</span></button>
      <button id="text-color" class="icon" aria-label="文字や背景の色"><span class="rainbow"></span></button>
      <button id="cancel-edit" class="small">キャンセル</button>
      <button id="done" class="pill">完了</button>
    </div>
    <div id="color-strip" class="swatches" hidden aria-label="文字の色"></div>
    <nav id="modes" aria-label="素材の選択"><button id="text-mode" class="mode" aria-current="true">テキスト</button><button id="photo-mode" class="mode">カメラロール</button><button id="camera-mode" class="mode">撮影</button></nav>
    <div id="trash" hidden aria-label="ここにドラッグして削除"><svg viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg><span>ここで指を離すと削除</span></div>
  </div>
  <input id="photo" type="file" accept="image/*" hidden>
  <input id="camera" type="file" accept="image/*" capture="environment" hidden>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<dialog id="sheet"><div class="sheet-heading"><h2 id="sheet-title"></h2><button id="close-sheet" class="icon" aria-label="閉じる">×</button></div><div id="sheet-content"></div></dialog>
<dialog id="reset-dialog"><h2>作り直しますか？</h2><p>今の下書きは削除されます。</p><div class="dialog-actions"><button id="cancel-reset">キャンセル</button><button id="confirm-reset" class="pill">作り直す</button></div></dialog>
<dialog id="save-dialog">
  <div class="sheet-heading"><h2>画像を保存</h2><button id="close-save" class="icon" aria-label="閉じる">×</button></div>
  <p id="save-message" role="status">画像を準備しています…</p>
  <img id="save-preview" alt="保存する画像" hidden>
  <button id="share-image" class="pill" hidden>保存・共有</button>
  <button id="download-image" class="sheet-button" hidden>ファイルとして保存</button>
</dialog>
<script src="app.js?v=6" defer></script>
</body></html>
