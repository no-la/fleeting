<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f0"><meta name="description" content="ふと思ったことを、一枚に。写真とことばで作るストーリーエディタ。"><title>fleeting — いまを、一枚に。</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><a class="brand" href="./">fleeting<span>✳</span></a><button id="export" class="primary">画像を保存 <span>↗</span></button></header>
<section class="intro"><div><p class="eyebrow">A LITTLE MOMENT, YOURS.</p><h1>いまを、一枚に。</h1></div><p class="sub">残してもいい。<br>消えてもいい。</p></section>
<div class="workspace"><section class="preview"><div class="canvas-wrap"><canvas id="canvas" width="1080" height="1920" tabindex="0" aria-label="ストーリーのプレビュー。文字をドラッグして移動できます"></canvas><span class="canvas-label">YOUR MOMENT</span></div><div class="preview-meta"><span><i></i> <span id="status" role="status">下書きはこの端末に保存</span></span><span>9:16 · 1080 × 1920</span></div></section>
<section class="editor" aria-label="編集ツール"><div class="tabs" role="tablist" aria-label="編集項目"><button role="tab" aria-selected="true" aria-controls="text-panel" id="text-tab" data-tab="text">Aa <span>ことば</span></button><button role="tab" aria-selected="false" aria-controls="background-panel" id="background-tab" data-tab="background">◑ <span>背景</span></button></div>
<div id="text-panel" role="tabpanel" aria-labelledby="text-tab"><div class="section-title"><label for="words">ことばを添える</label><span id="count">0 / 240</span></div><textarea id="words" maxlength="240" placeholder="いま、なにを思ってる？" rows="4"></textarea><p class="hint">キャンバスの文字はドラッグで動かせます。</p>
<div class="section-title"><span>文字のスタイル</span></div><div class="segmented" id="fonts"><button data-font="sans" aria-pressed="true">シンプル</button><button data-font="serif" aria-pressed="false">明朝</button><button data-font="mono" aria-pressed="false">タイプ</button></div>
<div class="row"><label for="size">文字サイズ</label><input id="size" type="range" min="36" max="110" value="72"><output id="size-value">72</output></div>
<div class="row"><span>揃え・装飾</span><div class="compact"><button id="align" aria-label="文字揃えを変更">中央揃え</button><button id="highlight" aria-pressed="false">文字背景</button></div></div><div class="row"><label for="text-color">文字色</label><input id="text-color" type="color" value="#ffffff"><button id="center" class="quiet">位置を中央に</button></div></div>
<div id="background-panel" role="tabpanel" aria-labelledby="background-tab" hidden><div class="section-title"><span>気分にあう色を</span><span>PALETTE</span></div><div id="palettes" class="palettes"></div><div class="row"><label for="custom-color">好きな色</label><input type="color" id="custom-color" value="#b95740"></div><div class="divider"></div><label class="upload" for="photo"><strong>＋ 写真を背景に</strong><span>タップして写真を選ぶ</span></label><input id="photo" type="file" accept="image/*" hidden><div id="photo-tools" hidden><div class="row"><label for="shade">写真を暗くする</label><input id="shade" type="range" min="0" max="75" value="20"></div><button id="remove-photo" class="quiet">写真を外す</button></div><p class="hint">写真はサーバーに送信されません。</p></div>
<div class="editor-bottom"><span>今日の、ひとこま。</span><button id="reset" class="quiet">はじめから ↺</button></div></section></div><footer><span>Made for moments, not metrics.</span><span>写真とことば。それだけで。</span></footer></main>
<dialog id="reset-dialog"><h2>新しく作りますか？</h2><p>いまの下書きは消えます。残したい場合は、先に画像を保存してください。</p><div><button id="cancel-reset">戻る</button><button id="confirm-reset" class="primary">新しく作る</button></div></dialog><script src="app.js" defer></script></body></html>
